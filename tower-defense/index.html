<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Стражи">
<meta name="theme-color" content="#121a14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<title>Стражи Долины</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Ruslan+Display&display=swap">
<style>
/* Layout: one-screen portrait game — HUD bar, square-grid battlefield, fixed bottom command sheet */
:root{
  --night:#121a14;      /* forest at dusk, page ground */
  --wood:#2a1f17;       /* panel wood */
  --wood-2:#3b2c20;     /* raised wood */
  --trim:#d4a24c;       /* brass trim / gold */
  --ivory:#f2e8d2;      /* primary text */
  --muted:#b5a68a;      /* secondary text */
  --ember:#e2643a;      /* danger, lives */
  --leaf:#86bf4f;       /* upgrades, positive */
  --arcane:#a98cf0;     /* magic */
  --font-display:"Ruslan Display", "Georgia", "Times New Roman", serif;
  --font-ui:"Alegreya Sans", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--ivory);overflow:hidden;overscroll-behavior:none}
body{font:500 15px/1.3 var(--font-ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--trim);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);
  background:radial-gradient(120% 70% at 50% 40%, #1b281d 0%, var(--night) 70%)}

/* HUD */
#hud{display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:52px;
  background:linear-gradient(var(--wood-2),var(--wood));border-bottom:2px solid #000;box-shadow:inset 0 -1px 0 rgba(212,162,76,.35)}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.stat svg{width:20px;height:20px;flex:none}
.stat.wave{flex:1;justify-content:center;font-size:15px;color:var(--muted);font-weight:700}
.stat.wave b{color:var(--ivory);font-size:17px}
.stat.flash{animation:flash .5s}
@keyframes flash{30%{transform:scale(1.25);color:var(--ember)}}
.hbtn{width:40px;height:40px;border-radius:10px;border:1px solid rgba(212,162,76,.55);background:#1a130d;
  display:grid;place-items:center;font-weight:800;font-size:15px;padding:0}
.hbtn svg{width:18px;height:18px}

/* Stage */
#stage{flex:1;position:relative;min-height:0;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;pointer-events:none;
  font:400 34px/1.1 var(--font-display);color:var(--trim);text-shadow:0 3px 0 #000,0 0 24px rgba(0,0,0,.8)}
#banner.show{animation:banner 1.8s ease-out forwards}
#banner small{display:block;font:700 15px var(--font-ui);color:var(--ivory);margin-top:6px}
@keyframes banner{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1.05)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0}}

/* Command sheet */
#sheet{height:calc(158px + env(safe-area-inset-bottom,0px));padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));
  background:linear-gradient(var(--wood-2),var(--wood) 30%);border-top:2px solid #000;box-shadow:inset 0 1px 0 rgba(212,162,76,.35);flex:none}
#sheet section{height:100%;display:flex;flex-direction:column;gap:8px}
.sh-head{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16px;letter-spacing:.02em}
.sh-head small{color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
.x{width:32px;height:32px;border-radius:8px;border:1px solid rgba(242,232,210,.2);background:transparent;display:grid;place-items:center;padding:0}
.x svg{width:14px;height:14px}

.idle-row{display:flex;gap:10px;align-items:stretch;flex:1;min-height:0}
.idle-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.idle-ttl{font-weight:800;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.35);font-size:13px;font-weight:700;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.hint{margin:0;color:var(--muted);font-size:13px}

.cta{border:0;border-radius:12px;padding:8px 14px;font-weight:800;font-size:16px;color:#2a1a08;
  background:linear-gradient(#f1c46b,var(--trim));box-shadow:0 3px 0 #7a5418,inset 0 1px 0 rgba(255,255,255,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.cta small{font-weight:700;font-size:12px;opacity:.8}
.cta:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5418}
.cta:disabled{filter:grayscale(.9) brightness(.7);box-shadow:none;transform:none;cursor:default}
#btn-wave{width:44%;max-width:190px}
.ghost{border:1px solid rgba(242,232,210,.3);border-radius:12px;background:rgba(0,0,0,.25);padding:8px 12px;font-weight:700;font-size:14px}
.ghost.warn{border-color:var(--ember);color:#ffc2ad;background:rgba(226,100,58,.18)}
.coin-i{width:14px;height:14px;vertical-align:-2px}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1;min-height:0}
.card{border:1px solid rgba(212,162,76,.45);border-radius:12px;background:rgba(0,0,0,.3);padding:4px 2px 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-width:0}
.card canvas{width:52px;height:52px}
.card .nm{font-weight:800;font-size:13px;white-space:nowrap}
.card .cs{font-weight:800;font-size:14px;color:var(--trim);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:3px}
.card:active{background:rgba(212,162,76,.18)}
.card.off{opacity:.45}
.card.off .cs{color:var(--ember)}

.tw-body{display:flex;gap:10px;flex:1;min-height:0;align-items:center}
#tw-icon{width:60px;height:60px;flex:none}
#tw-stats{margin:0;flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px;align-content:center}
#tw-stats dt{color:var(--muted)}
#tw-stats dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tw-stats .up{color:var(--leaf)}
.tw-actions{display:flex;flex-direction:column;gap:8px;width:128px;flex:none}
.tw-actions .cta{padding:7px 8px;font-size:14px}
.tw-actions .ghost{padding:7px 8px;font-size:13px}

/* Screens */
.screen{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
#menu{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
  background:radial-gradient(90% 50% at 50% 0%, rgba(212,162,76,.18), transparent 70%),linear-gradient(#18241a,#0d130e)}
.logo{text-align:center;margin:8px 0 6px}
.logo h1{font:400 clamp(34px,10vw,52px)/1.05 var(--font-display);margin:0;color:var(--trim);
  text-shadow:0 3px 0 #000,0 0 30px rgba(212,162,76,.25);text-wrap:balance}
.logo p{margin:10px auto 0;max-width:30ch;color:var(--muted);font-size:15px;text-wrap:balance}
#crest{width:120px;height:120px;margin:4px auto 0;display:block}
.levels{display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px;margin-top:18px}
.lvl{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:10px;border-radius:14px;
  border:1px solid rgba(212,162,76,.5);background:linear-gradient(var(--wood-2),var(--wood));box-shadow:0 4px 0 #0a0705}
.lvl canvas{width:64px;height:96px;border-radius:6px;border:2px solid #000;flex:none}
.lvl .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lvl .n{font:400 18px/1.15 var(--font-display);color:var(--ivory)}
.lvl .s{color:var(--muted);font-size:13px}
.lvl .meta{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.lvl:disabled{opacity:.5;cursor:default}
.lvl:disabled canvas{filter:grayscale(1) brightness(.6)}
.menu-foot{margin-top:18px;display:flex;gap:10px;align-items:center}

.modal{background:rgba(6,9,7,.72);justify-content:center;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.panel{width:100%;max-width:340px;border-radius:18px;padding:22px 18px 18px;text-align:center;
  background:linear-gradient(var(--wood-2),var(--wood));border:2px solid var(--trim);box-shadow:0 10px 40px rgba(0,0,0,.6)}
.panel h2{font:400 30px/1.1 var(--font-display);margin:0 0 6px;color:var(--trim)}
.panel p{margin:0 0 16px;color:var(--muted)}
.panel .btns{display:flex;flex-direction:column;gap:10px}
.panel .cta{padding:12px}
.panel .ghost{padding:11px}
.big-stars{display:flex;justify-content:center;gap:8px;margin:6px 0 12px}
.big-stars svg{width:46px;height:46px;transform:scale(0);animation:pop .4s cubic-bezier(.3,1.6,.5,1) forwards}
.big-stars svg:nth-child(2){animation-delay:.25s}
.big-stars svg:nth-child(3){animation-delay:.5s}
@keyframes pop{to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="stat" id="st-lives" title="Жизни замка">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#e2643a" stroke="#5a1c0c" stroke-width="1.5" d="M12 21s-7.5-4.6-9.3-9.4C1.4 8 3.6 4.5 7.1 4.5c2 0 3.6 1.1 4.9 2.8 1.3-1.7 2.9-2.8 4.9-2.8 3.5 0 5.7 3.5 4.4 7.1C19.5 16.4 12 21 12 21z"/></svg>
      <b id="lives">20</b>
    </div>
    <div class="stat" id="st-gold" title="Золото">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#f1c46b" stroke="#7a5418" stroke-width="2"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#b07f2a" stroke-width="1.5"/></svg>
      <b id="gold">0</b>
    </div>
    <div class="stat wave">Волна&nbsp;<b id="wave">0/10</b></div>
    <button id="btn-speed" class="hbtn" aria-label="Скорость игры">×1</button>
    <button id="btn-pause" class="hbtn" aria-label="Пауза">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="currentColor"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="currentColor"/></svg>
    </button>
  </header>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="banner"></div>
  </main>

  <footer id="sheet">
    <section id="sh-idle">
      <div class="idle-row">
        <div class="idle-info">
          <div class="idle-ttl" id="idle-ttl">Первая волна</div>
          <div class="chips" id="idle-chips"></div>
        </div>
        <button id="btn-wave" class="cta">Начать битву<small id="wave-sub"></small></button>
      </div>
      <p class="hint" id="idle-hint">Нажмите на свободную клетку у дороги, чтобы построить башню.</p>
    </section>

    <section id="sh-build" hidden>
      <div class="sh-head"><span>Построить башню</span>
        <button class="x" data-close aria-label="Закрыть"><svg viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <section id="sh-tower" hidden>
      <div class="sh-head"><span><span id="tw-name"></span><small id="tw-lvl"></small></span>
        <button class="x" data-close aria-label="Закрыть"><svg viewBox="0 0 14 14"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <div class="tw-body">
        <canvas id="tw-icon"></canvas>
        <dl id="tw-stats"></dl>
        <div class="tw-actions">
          <button id="btn-up" class="cta"></button>
          <button id="btn-sell" class="ghost"></button>
        </div>
      </div>
    </section>
  </footer>

  <div id="menu" class="screen">
    <canvas id="crest"></canvas>
    <div class="logo">
      <h1>Стражи Долины</h1>
      <p>Стройте башни у дороги и не пропустите орду к воротам замка.</p>
    </div>
    <div class="levels" id="levels"></div>
    <div class="menu-foot">
      <button class="ghost" id="btn-sound-menu">Звук: вкл</button>
    </div>
  </div>

  <div id="pause" class="screen modal" hidden>
    <div class="panel">
      <h2>Пауза</h2>
      <p id="pause-sub">Битва ждёт вашего приказа.</p>
      <div class="btns">
        <button class="cta" id="btn-resume">Продолжить</button>
        <button class="ghost" id="btn-sound">Звук: вкл</button>
        <button class="ghost" id="btn-restart">Начать карту заново</button>
        <button class="ghost" id="btn-menu">Выйти в меню</button>
      </div>
    </div>
  </div>

  <div id="end" class="screen modal" hidden>
    <div class="panel">
      <h2 id="end-title">Победа!</h2>
      <div class="big-stars" id="end-stars"></div>
      <p id="end-sub"></p>
      <div class="btns">
        <button class="cta" id="btn-next">Следующая карта</button>
        <button class="ghost" id="btn-again">Сыграть ещё раз</button>
        <button class="ghost" id="btn-end-menu">В меню</button>
      </div>
    </div>
  </div>
</div>

<script>

const COLS = 8, ROWS = 12;
const $ = s => document.querySelector(s);

/* ---------------- Сохранение ---------------- */
const SAVE_KEY = 'vale-guardians-v1';
let save = { stars: [0, 0, 0], muted: false };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (s && Array.isArray(s.stars)) save = Object.assign(save, s);
} catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------------- Данные ---------------- */

const TOWER_ORDER = ['archer', 'mage', 'cannon', 'frost'];

const LEVELS = [

let G = null;

    wave: 0, total: L.waves.length, towers: [], enemies: [], projs: [], parts: [], texts: [], spawnQ: [],

}
function towerAt(c, r) { return G.towers.find(t => t.c === c && t.r === r); }

    G.gold += bonus;

  } else showBanner(`Волна ${G.wave + 1}`, G.wave === G.total - 1 ? 'Последний натиск' : '');
  if (G.wave > 0) { const pay = 18 + 4 * G.wave; G.gold += pay; G.texts.push({ x: COLS / 2, y: ROWS - 0.8, txt: `Казна +${pay}`, color: '#f1c46b', life: 1.6, max: 1.6 }); }
  const hpMul = G.L.hpMul * (1 + 0.05 * G.wave);
  let t = 0.4;
  for (const gr of parseWave(G.L.waves[G.wave])) {
    for (let i = 0; i < gr.n; i++) { G.spawnQ.push({ at: G.time + t, type: gr.type, hpMul }); t += gr.iv; }
    t += 1.5;

  G.wave++; G.nextTimer = -1;

}
function spawn(type, hpMul) {
  const def = ENEMIES[type], hp = Math.round(def.hp * hpMul);
  const e = { id: G.uid++, type, def, hp, maxHp: hp, d: 0, off: (Math.random() - 0.5) * 0.32, slowF: 0, slowT: 0,
    x: 0, y: 0, ang: 0, bob: Math.random() * 6, healCd: 2, flash: 0, dead: false };
  if (def.boss) { e.off = 0; showBanner(def.name, 'Босс вышел на тропу'); }

}
function placeEnemy(e) {
  const p = posAt(G.path, e.d);
  e.x = p.x - Math.sin(p.ang) * e.off; e.y = p.y + Math.cos(p.ang) * e.off; e.ang = p.ang;
}
function enemySpeed(e) { return e.def.spd * (e.slowT > 0 ? 1 - e.slowF : 1); }

function damage(e, amt, type) {
  if (e.dead) return;
  const mult = type === 'phys' ? 1 - e.def.armor : 1 - e.def.mres;
  e.hp -= amt * mult; e.flash = 0.08;
  if (e.hp <= 0) {
    e.dead = true;
    G.gold += e.def.bounty;
    floatText(e.x, e.y - e.def.r, '+' + e.def.bounty, '#f1c46b');
    burst(e.x, e.y, e.def.color, e.def.boss ? 30 : 10, 2.2, 0.07, 0.5);
    G.parts.push({ kind: 'ring', x: e.x, y: e.y, life: 0.35, max: 0.35, size: e.def.r * 2.2, color: 'rgba(255,255,255,0.6)' });

/* эффекты */
function burst(x, y, color, n, spd, size, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = spd * (0.3 + Math.random() * 0.7);
    G.parts.push({ kind: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.5, life: life * (0.6 + Math.random() * 0.4), max: life, size: size * (0.6 + Math.random() * 0.6), color });

/* выстрелы */
function fire(t, tgt) {
  const st = TS(t), k = t.kind;
  t.ang = Math.atan2(tgt.y - t.y, tgt.x - t.x);
  if (k === 'archer') {
    G.projs.push({ kind: 'arrow', x: t.x, y: t.y - 0.55, tgt, tx: tgt.x, ty: tgt.y, spd: 10, dmg: st.dmg, type: 'phys' });
    sfx('arrow');
  } else if (k === 'mage') {
    G.projs.push({ kind: 'bolt', x: t.x, y: t.y - 0.62 - t.lvl * 0.08, tgt, tx: tgt.x, ty: tgt.y, spd: 6.5, dmg: st.dmg, type: 'magic', chain: st.chain || 0 });
    sfx('bolt');
  } else if (k === 'cannon') {

    const dur = Math.hypot(tgt.x - sx, tgt.y - sy) / 4.5 + 0.25;
    const fd = Math.min(G.path.len, tgt.d + enemySpeed(tgt) * dur);
    const p = posAt(G.path, fd);
    G.projs.push({ kind: 'ball', sx, sy, ex: p.x - Math.sin(p.ang) * tgt.off, ey: p.y + Math.cos(p.ang) * tgt.off, t: 0, dur, dmg: st.dmg, splash: st.splash, x: sx, y: sy, h: 0 });
    t.recoil = 1;
    burst(sx + Math.cos(t.ang) * 0.35, sy + Math.sin(t.ang) * 0.35, 'rgba(200,200,200,0.8)', 5, 0.8, 0.08, 0.4);
    sfx('arrow');
  } else if (k === 'frost') {

/* ---------------- Шаг симуляции ---------------- */
function step(dt) {

  for (const e of G.enemies) {

        e.healCd = 2.5;

          if (o.dead || o.hp >= o.maxHp || dist2(o.x, o.y, e.x, e.y) > 1.4 * 1.4) continue;
          o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.08);
          burst(o.x, o.y, '#7dff9a', 4, 0.8, 0.05, 0.5);

    const st = TS(t), r2 = st.range * st.range;

    if (best) { fire(t, best); t.cd = st.cd; }

    if (p.kind === 'bolt' && Math.random() < 0.6) G.parts.push({ kind: 'dot', x: p.x, y: p.y, vx: 0, vy: 0, life: 0.25, max: 0.25, size: 0.05, color: '#b48cff' });
  }

  for (const q of G.parts) { q.life -= dt; if (q.vx !== undefined) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 3 * dt; } }
  for (const q of G.texts) { q.life -= dt; q.y -= dt * 0.8; }

  G.enemies = G.enemies.filter(e => !e.dead);
  G.projs = G.projs.filter(p => !p.done);
  G.parts = G.parts.filter(q => q.life > 0);
  G.texts = G.texts.filter(q => q.life > 0);
  if (G.parts.length > 600) G.parts.splice(0, G.parts.length - 600);

  if (G.lives <= 0) endGame(false);
  else if (G.wave >= G.total && !G.spawnQ.length && !G.enemies.length) endGame(true);
}

/* ---------------- Отрисовка ---------------- */
const cv = $('#cv'), ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1, S = 40, OX = 0, OY = 0, BG = null;

function resize() {
  const r = $('#stage').getBoundingClientRect();
  VW = Math.max(1, r.width); VH = Math.max(1, r.height); DPR = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  S = Math.max(8, Math.floor(Math.min(VW / COLS, VH / ROWS)));
  OX = Math.floor((VW - S * COLS) / 2); OY = Math.floor((VH - S * ROWS) / 2);
  if (G) BG = renderBg(G.li, S, DPR);
}

function render() {
  const g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, VW, VH);
  if (!G || !BG) return;
  g.save(); g.translate(OX, OY);
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(-3, -3, COLS * S + 6, ROWS * S + 6);
  g.drawImage(BG, 0, 0, COLS * S, ROWS * S);
  g.beginPath(); g.rect(0, 0, COLS * S, ROWS * S); g.clip();

  // выделение
  const sel = G.sel;
  if (sel && sel.tower) {
    const t = sel.tower, rr = TS(t).range * S;
    g.fillStyle = 'rgba(255,240,200,0.12)'; circ(g, t.x * S, t.y * S, rr);
    g.strokeStyle = 'rgba(255,230,170,0.7)'; g.lineWidth = 2; g.setLineDash([6, 5]);
    g.beginPath(); g.arc(t.x * S, t.y * S, rr, 0, TAU); g.stroke(); g.setLineDash([]);
  } else if (sel) {
    const a = 0.55 + 0.35 * Math.sin(ANIM * 6);
    g.strokeStyle = `rgba(241,196,107,${a})`; g.lineWidth = 3;
    rrect(g, sel.c * S + 3, sel.r * S + 3, S - 6, S - 6, S * 0.15); g.stroke();
    g.fillStyle = 'rgba(241,196,107,0.15)'; g.fill();
  }

  // сущности по глубине
  const list = [];
  for (const t of G.towers) list.push({ y: t.y + 0.3, t });
  for (const e of G.enemies) list.push({ y: e.y + e.def.r, e });
  list.sort((a, b) => a.y - b.y);
  for (const it of list) {
    if (it.t) drawTower(g, it.t.kind, it.t.lvl, it.t.x * S, it.t.y * S, S, it.t.ang, ANIM, it.t.recoil);
    else drawEnemy(g, it.e, S, ANIM);
  }

  // снаряды
  for (const p of G.projs) {
    const x = p.x * S, y = p.y * S;
    if (p.kind === 'arrow') {
      g.save(); g.translate(x, y); g.rotate(p.ang);
      g.strokeStyle = '#5a3a1e'; g.lineWidth = Math.max(1.5, S * 0.035); line(g, -S * 0.16, 0, S * 0.12, 0);
      g.fillStyle = '#d9dde3'; poly(g, [S * 0.16, 0, S * 0.1, -S * 0.04, S * 0.1, S * 0.04]);
      g.fillStyle = '#f2ecd8'; poly(g, [-S * 0.16, 0, -S * 0.2, -S * 0.05, -S * 0.1, 0, -S * 0.2, S * 0.05]);
      g.restore();
    } else if (p.kind === 'bolt') {
      const gr = g.createRadialGradient(x, y, 0, x, y, S * 0.2);
      gr.addColorStop(0, 'rgba(240,230,255,1)'); gr.addColorStop(0.4, 'rgba(180,140,255,0.8)'); gr.addColorStop(1, 'rgba(180,140,255,0)');
      g.fillStyle = gr; circ(g, x, y, S * 0.2);
    } else if (p.kind === 'ball') {
      g.fillStyle = 'rgba(0,0,0,0.3)'; ell(g, x, y, S * 0.09, S * 0.04);
      g.fillStyle = '#222326'; circ(g, x, y - p.h * S, S * 0.09);
      g.fillStyle = 'rgba(255,255,255,0.35)'; circ(g, x - S * 0.03, y - p.h * S - S * 0.03, S * 0.03);
    } else if (p.kind === 'shard') {
      g.save(); g.translate(x, y); g.rotate(p.ang);
      g.fillStyle = '#dff7ff'; poly(g, [S * 0.14, 0, 0, -S * 0.05, -S * 0.12, 0, 0, S * 0.05]);
      g.restore();
    }
  }

  // частицы
  for (const q of G.parts) {
    const k = Math.max(0, q.life / q.max);
    if (q.kind === 'dot') { g.globalAlpha = k; g.fillStyle = q.color; circ(g, q.x * S, q.y * S, q.size * S * (0.4 + 0.6 * k)); }
    else if (q.kind === 'ring') {
      g.globalAlpha = k; g.strokeStyle = q.color; g.lineWidth = Math.max(1, S * 0.05 * k + 1);
      g.beginPath(); g.arc(q.x * S, q.y * S, q.size * S * (1 - k * 0.7), 0, TAU); g.stroke();
    } else if (q.kind === 'zap') {
      g.globalAlpha = k; g.strokeStyle = '#e4d6ff'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(q.x * S, q.y * S);
      for (let i = 1; i < 5; i++) {
        const f = i / 5;
        g.lineTo((q.x + (q.x2 - q.x) * f) * S + (Math.random() - 0.5) * S * 0.2, (q.y + (q.y2 - q.y) * f) * S + (Math.random() - 0.5) * S * 0.2);
      }
      g.lineTo(q.x2 * S, q.y2 * S); g.stroke();
    }
  }
  g.globalAlpha = 1;

  g.textAlign = 'center'; g.font = `800 ${Math.round(S * 0.32)}px "Alegreya Sans", "Trebuchet MS", sans-serif`;
  for (const q of G.texts) {
    g.globalAlpha = Math.min(1, q.life / q.max * 1.6);
    g.lineWidth = 3; g.strokeStyle = 'rgba(0,0,0,0.75)'; g.strokeText(q.txt, q.x * S, q.y * S);
    g.fillStyle = q.color; g.fillText(q.txt, q.x * S, q.y * S);
  }
  g.globalAlpha = 1;
  g.restore();

  if (G.hurt > 0) {
    const gr = g.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
    gr.addColorStop(0, 'rgba(200,30,20,0)'); gr.addColorStop(1, `rgba(200,30,20,${G.hurt * 0.8})`);
    g.fillStyle = gr; g.fillRect(0, 0, VW, VH);
  }
}

/* ---------------- Интерфейс ---------------- */
const COIN = '<svg class="coin-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#f1c46b" stroke="#7a5418" stroke-width="2.5"/></svg>';
const STAR = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="${on ? '#f1c46b' : 'rgba(0,0,0,0.35)'}" stroke="${on ? '#7a5418' : 'rgba(242,232,210,0.3)'}" stroke-width="1.3" stroke-linejoin="round"/></svg>`;
let MODE = 'idle';
const cache = new Map();
function setTxt(el, v) { if (cache.get(el) !== v) { cache.set(el, v); el.textContent = v; } }
function setHtml(el, v) { if (cache.get(el) !== v) { cache.set(el, v); el.innerHTML = v; } }

function setMode(m) {
  MODE = m;
  $('#sh-idle').hidden = m !== 'idle'; $('#sh-build').hidden = m !== 'build'; $('#sh-tower').hidden = m !== 'tower';
  if (G) G.sellArm = false;
  if (m === 'idle' && G) G.sel = null;
}
function iconCanvas(cvEl, kind, lvl, px) {
  const d = Math.min(window.devicePixelRatio || 1, 3);
  cvEl.width = px * d; cvEl.height = px * d;
  const g = cvEl.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, px, px);
  drawTower(g, kind, lvl, px / 2, px * 0.7, px * 0.52, -Math.PI / 4, 1.2, 0);
}
function buildCards() {
  const box = $('#cards'); box.innerHTML = '';
  for (const k of TOWER_ORDER) {
    const T = TOWERS[k], b = document.createElement('button');
    b.className = 'card'; b.dataset.kind = k;
    b.setAttribute('aria-label', `${T.name}, ${T.levels[0].cost} золота`);
    b.innerHTML = `<canvas></canvas><span class="nm">${T.short}</span><span class="cs">${COIN}${T.levels[0].cost}</span>`;
    iconCanvas(b.querySelector('canvas'), k, 0, 52);
    b.addEventListener('click', () => buildTower(k));
    box.appendChild(b);
  }
}
function buildTower(kind) {
  if (!G || !G.sel || G.sel.tower || G.over) return;
  const cost = TOWERS[kind].levels[0].cost;
  if (G.gold < cost) { sfx('nope'); return; }
  const { c, r } = G.sel;
  if (G.grid[r][c] !== 0 || towerAt(c, r)) return;
  G.gold -= cost;
  G.towers.push({ kind, lvl: 0, c, r, x: c + 0.5, y: r + 0.5, cd: 0.2, ang: -Math.PI / 2, spent: cost, recoil: 0 });
  burst(c + 0.5, r + 0.8, 'rgba(160,140,110,0.9)', 10, 1.2, 0.08, 0.5);
  sfx('build');
  setMode('idle');
}
function upgradeTower() {
  const t = G && G.sel && G.sel.tower; if (!t || t.lvl >= 2 || G.over) return;
  const cost = TOWERS[t.kind].levels[t.lvl + 1].cost;
  if (G.gold < cost) { sfx('nope'); return; }
  G.gold -= cost; t.spent += cost; t.lvl++;
  burst(t.x, t.y - 0.3, '#f1c46b', 14, 1.6, 0.06, 0.6);
  sfx('upgrade'); G.sellArm = false;
}
function sellTower() {
  const t = G && G.sel && G.sel.tower; if (!t || G.over) return;
  if (!G.sellArm) { G.sellArm = true; return; }
  const v = Math.floor(t.spent * SELL_RATE);
  G.gold += v; G.towers = G.towers.filter(o => o !== t);
  floatText(t.x, t.y - 0.3, '+' + v, '#f1c46b');
  burst(t.x, t.y, 'rgba(160,140,110,0.9)', 12, 1.4, 0.08, 0.5);
  sfx('sell'); setMode('idle');
}

function statRows(t) {
  const T = TOWERS[t.kind], a = T.levels[t.lvl], b = T.levels[t.lvl + 1];
  const up = (cur, nxt, fmt) => fmt(cur) + (nxt !== undefined && nxt !== cur ? ` <span class="up">→ ${fmt(nxt)}</span>` : '');
  const n = v => String(Math.round(v * 10) / 10).replace('.', ',');
  let html = `<dt>Урон</dt><dd>${up(a.dmg, b && b.dmg, n)} ${T.type === 'magic' ? '· магия' : ''}</dd>`;
  html += `<dt>Дальность</dt><dd>${up(a.range, b && b.range, n)}</dd>`;
  html += `<dt>Выстрелы</dt><dd>${up(1 / a.cd, b && 1 / b.cd, v => n(v) + '/с')}</dd>`;
  let sp = T.special;
  if (t.kind === 'mage') sp = (b && b.chain && !a.chain) ? '<span class="up">→ цепь молний</span>' : a.chain ? 'Цепь молний ×' + a.chain : sp;
  if (t.kind === 'frost') sp = `Замедление ${up(a.slow * 100, b && b.slow * 100, v => Math.round(v) + '%')}`;
  if (t.kind === 'cannon') sp = `Взрыв ${up(a.splash, b && b.splash, n)} кл.`;
  html += `<dt>Особое</dt><dd>${sp}</dd>`;
  return html;
}

function ui() {
  setTxt($('#lives'), String(G.lives));
  setTxt($('#gold'), String(G.gold));
  setTxt($('#wave'), `${G.wave}/${G.total}`);
  setTxt($('#btn-speed'), '×' + G.speed);

  if (MODE === 'idle') {
    const btn = $('#btn-wave');
    let ttl, chipsKey = G.wave;
    if (G.wave === 0) ttl = 'Первая волна';
    else if (G.wave < G.total) ttl = `Далее: волна ${G.wave + 1} из ${G.total}`;
    else ttl = 'Все волны в пути — держитесь!';
    setTxt($('#idle-ttl'), ttl);
    if (cache.get('chips') !== chipsKey) {
      cache.set('chips', chipsKey);
      let html = '';
      if (G.wave < G.total) {
        const agg = {};
        for (const gr of parseWave(G.L.waves[G.wave])) agg[gr.type] = (agg[gr.type] || 0) + gr.n;
        for (const k in agg) html += `<span class="chip"><i style="background:${ENEMIES[k].color}"></i>${ENEMIES[k].name} ×${agg[k]}</span>`;
      }
      $('#idle-chips').innerHTML = html;
    }
    let label, sub = '', dis = false;
    if (G.wave === 0) label = 'Начать битву';
    else if (G.spawnQ.length) { label = 'Волна идёт'; dis = true; }
    else if (G.wave < G.total && G.nextTimer > 0) { label = 'Вызвать волну'; sub = `+${Math.ceil(G.nextTimer)} золота · ${Math.ceil(G.nextTimer)} с`; }
    else { label = 'Последняя волна'; dis = true; }
    setHtml(btn, `${label}<small>${sub}</small>`);
    btn.disabled = dis;
  } else if (MODE === 'build') {
    for (const b of document.querySelectorAll('.card')) b.classList.toggle('off', G.gold < TOWERS[b.dataset.kind].levels[0].cost);
  } else if (MODE === 'tower' && G.sel && G.sel.tower) {
    const t = G.sel.tower, T = TOWERS[t.kind];
    const key = t.kind + t.lvl;
    if (cache.get('twkey') !== key || cache.get('twobj') !== t) {
      cache.set('twkey', key); cache.set('twobj', t);
      setTxt($('#tw-name'), T.name); setTxt($('#tw-lvl'), `уровень ${t.lvl + 1}`);
      $('#tw-stats').innerHTML = statRows(t);
      iconCanvas($('#tw-icon'), t.kind, t.lvl, 60);
    }
    const bu = $('#btn-up');
    if (t.lvl < 2) {
      const cost = T.levels[t.lvl + 1].cost;
      setHtml(bu, `Улучшить<small>${COIN} ${cost}</small>`); bu.disabled = G.gold < cost;
    } else { setHtml(bu, 'Максимум<small>уровень 3</small>'); bu.disabled = true; }
    const bs = $('#btn-sell'), v = Math.floor(t.spent * SELL_RATE);
    setHtml(bs, G.sellArm ? `Точно продать за ${v}?` : `Продать за ${COIN} ${v}`);
    bs.classList.toggle('warn', G.sellArm);
  }
}

function showBanner(title, sub) {
  const b = $('#banner');
  b.innerHTML = title + (sub ? `<small>${sub}</small>` : '');
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}

/* ---------------- Ввод ---------------- */
let down = null;
cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
cv.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 14 || !G || G.over) return;
  const rect = cv.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left - OX) / S), r = Math.floor((e.clientY - rect.top - OY) / S);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) { setMode('idle'); return; }
  const t = towerAt(c, r);
  if (t) {
    if (G.sel && G.sel.tower === t) { setMode('idle'); return; }
    G.sel = { tower: t }; setMode('tower'); return;
  }
  if (G.grid[r][c] === 0) {
    if (G.sel && !G.sel.tower && G.sel.c === c && G.sel.r === r) { setMode('idle'); return; }
    setMode('build'); G.sel = { c, r }; return;
  }
  setMode('idle');
});
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => setMode('idle')));
$('#btn-wave').addEventListener('click', () => startWave());
$('#btn-up').addEventListener('click', upgradeTower);
$('#btn-sell').addEventListener('click', sellTower);
$('#btn-speed').addEventListener('click', () => { if (G) G.speed = G.speed >= 3 ? 1 : G.speed + 1; });
$('#btn-pause').addEventListener('click', () => setPaused(true));
$('#btn-resume').addEventListener('click', () => setPaused(false));
$('#btn-restart').addEventListener('click', () => { $('#pause').hidden = true; newGame(G.li); });
$('#btn-menu').addEventListener('click', () => { $('#pause').hidden = true; showMenu(); });
$('#btn-again').addEventListener('click', () => { $('#end').hidden = true; newGame(G.li); });
$('#btn-next').addEventListener('click', () => { $('#end').hidden = true; newGame(Math.min(LEVELS.length - 1, G.li + 1)); });
$('#btn-end-menu').addEventListener('click', () => { $('#end').hidden = true; showMenu(); });
function toggleSound() { save.muted = !save.muted; persist(); soundLabels(); if (!save.muted) sfx('upgrade'); }
function soundLabels() { const t = save.muted ? 'Звук: выкл' : 'Звук: вкл'; $('#btn-sound').textContent = t; $('#btn-sound-menu').textContent = t; }
$('#btn-sound').addEventListener('click', toggleSound);
$('#btn-sound-menu').addEventListener('click', toggleSound);
document.addEventListener('pointerdown', () => { if (!save.muted) au(); }, { passive: true });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.over) setPaused(true); });
document.addEventListener('keydown', e => {
  if (!G || !$('#menu').hidden) return;
  if (e.key === 'p' || e.key === 'Escape') setPaused(!G.paused);
  if (e.key === ' ' && !G.paused) { e.preventDefault(); startWave(); }
});

function setPaused(p) {
  if (!G || G.over) return;
  G.paused = p; $('#pause').hidden = !p;
  if (p) $('#pause-sub').textContent = `${G.L.name} · волна ${G.wave} из ${G.total}`;
}

function endGame(win) {
  if (G.over) return;
  G.over = true; setMode('idle');
  const stars = win ? (G.lives >= G.maxLives * 0.9 ? 3 : G.lives >= G.maxLives * 0.5 ? 2 : 1) : 0;
  if (win && stars > (save.stars[G.li] || 0)) { save.stars[G.li] = stars; persist(); }
  setTimeout(() => {
    $('#end-title').textContent = win ? 'Победа!' : 'Замок пал';
    $('#end-stars').innerHTML = win ? [0, 1, 2].map(i => STAR(i < stars)).join('') : '';
    $('#end-sub').textContent = win
      ? `${G.L.name}: уцелело ${G.lives} из ${G.maxLives} жизней.` + (G.li === LEVELS.length - 1 ? ' Все земли защищены!' : '')
      : `Орда прорвалась на волне ${G.wave} из ${G.total}. Попробуйте другую расстановку башен.`;
    $('#btn-next').hidden = !win || G.li >= LEVELS.length - 1;
    $('#btn-again').textContent = win ? 'Сыграть ещё раз' : 'Попробовать снова';
    $('#end').hidden = false;
    sfx(win ? 'win' : 'lose');
  }, win ? 600 : 900);
}

/* ---------------- Меню ---------------- */
function showMenu() {
  G = null; BG = null; setMode('idle');
  const box = $('#levels'); box.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const unlocked = i === 0 || save.stars[i - 1] > 0;
    const b = document.createElement('button'); b.className = 'lvl'; b.disabled = !unlocked;
    const th = renderBg(i, 8, Math.min(window.devicePixelRatio || 1, 3));
    b.innerHTML = `<span class="t"><span class="n">${L.name}</span><span class="s">${unlocked ? L.sub : 'Пройдите предыдущую карту'}</span>
      <span class="meta"><span class="stars">${[0, 1, 2].map(k => STAR(k < save.stars[i])).join('')}</span>${L.waves.length} волн</span></span>`;
    b.prepend(th);
    b.addEventListener('click', () => { $('#menu').hidden = true; resize(); newGame(i); });
    box.appendChild(b);
  });
  soundLabels();
  $('#menu').hidden = false;
}
function drawCrest() {
  const el = $('#crest'), px = 120, d = Math.min(window.devicePixelRatio || 1, 3);
  el.width = px * d; el.height = px * d;
  const g = el.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0);
  const gr = g.createRadialGradient(60, 60, 10, 60, 60, 60);
  gr.addColorStop(0, 'rgba(212,162,76,0.35)'); gr.addColorStop(1, 'rgba(212,162,76,0)');
  g.fillStyle = gr; circ(g, 60, 60, 60);
  drawTower(g, 'mage', 2, 60, 78, 78, 0, ANIM, 0);
}

/* ---------------- Цикл ---------------- */
let lastT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (ts - lastT) / 1000)); lastT = ts;
  ANIM += dt;
  if (G && !G.paused && !G.over) for (let i = 0; i < G.speed; i++) step(dt);
  if (G) { render(); ui(); }
  else if (!$('#menu').hidden) drawCrest();
}

window.addEventListener('resize', () => { resize(); });
buildCards();
resize();
showMenu();
requestAnimationFrame(frame);

// Отладочный доступ (для тестов и генерации иконок)
window.__td = { get G() { return G; }, newGame, step, startWave, TOWERS, LEVELS,
  place(kind, c, r) { G.sel = { c, r }; buildTower(kind); },
  icon(px) {
    const c = document.createElement('canvas'); c.width = c.height = px; const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, px); gr.addColorStop(0, '#2a4a2c'); gr.addColorStop(1, '#121a14');
    g.fillStyle = gr; g.fillRect(0, 0, px, px);
    const rg = g.createRadialGradient(px / 2, px * 0.42, 0, px / 2, px * 0.42, px * 0.5);
    rg.addColorStop(0, 'rgba(212,162,76,0.45)'); rg.addColorStop(1, 'rgba(212,162,76,0)');
    g.fillStyle = rg; g.fillRect(0, 0, px, px);
    drawTower(g, 'mage', 2, px / 2, px * 0.76, px * 0.5, 0, 0.6, 0);
    return c.toDataURL('image/png');
  } };
